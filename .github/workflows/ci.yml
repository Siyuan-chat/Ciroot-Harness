name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  python-smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[investigation]" pytest fastapi httpx pypdfium2

      - name: Compile Python package
        run: python -m compileall -q src

      - name: Run deterministic smoke tests
        run: |
          pytest -q \
            tests/test_harness.py \
            tests/test_investigation_contracts.py \
            tests/test_gui_api_conversation.py \
            tests/test_investigation_report_data.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax checks
        run: npm run check

      - name: Frontend tests
        run: npm test
