[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-harness"
version = "0.1.0"
description = "Local-first, evidence-traceable research harness"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
full = ["langgraph>=0.2", "docling>=2", "fastembed>=0.4", "qdrant-client>=1.12", "llama-index-core>=0.11"]
test = []

[project.scripts]
rh = "research_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

