[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-harness"
version = "0.1.0"
description = "Local-first, evidence-traceable research harness"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23", "requests>=2.32", "langgraph>=1.2", "filelock>=3.16"]

[project.optional-dependencies]
investigation = ["pypdf>=5", "mcp==2.2.0"]
full = ["langgraph>=0.2", "docling==2.126.0", "fastembed==0.8.0", "qdrant-client==1.19.0", "llama-index-core==0.14.24", "rank-bm25==0.2.2", "nltk==3.9.2"]
rag = ["docling==2.126.0", "fastembed==0.8.0", "qdrant-client==1.19.0", "llama-index-core==0.14.24", "rank-bm25==0.2.2", "nltk==3.9.2"]
mcp = ["mcp==2.2.0"]
rag-mcp = ["docling==2.126.0", "fastembed==0.8.0", "qdrant-client==1.19.0", "llama-index-core==0.14.24", "rank-bm25==0.2.2", "nltk==3.9.2", "mcp==2.2.0"]
literature = ["pypdf>=5"]
test = []

[project.scripts]
rh = "research_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_harness = ["schemas/*.json", "fixtures/*.json", "fixtures/*.txt", "prompts/investigation/*.md", "examples/investigation/*.json"]
